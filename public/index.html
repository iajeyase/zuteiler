<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#07080d">
  <title>Zuteiler</title>
  <meta name="description" content="Zuteiler: join a room, the host draws, everyone finds out exactly one person they give a gift to.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Zuteiler home">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="13" class="mark-ring"/>
        <circle cx="20" cy="7" r="4.5" class="mark-dot"/>
        <circle cx="31.1" cy="26.5" r="4.5" class="mark-dot"/>
        <circle cx="8.9" cy="26.5" r="4.5" class="mark-dot"/>
      </svg>
      <span class="brand-name">Zuteiler</span>
    </a>
    <div class="controls">
      <button id="langBtn" class="pill" type="button" aria-label="Switch language">DE</button>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch theme"></button>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
